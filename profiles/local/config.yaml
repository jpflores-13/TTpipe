## Run everything on the current machine (workstation or one interactive node):
## no scheduler. Start with: bash TTpipe.sh
cores: all
software-deployment-method: conda
latency-wait: 60

## Global limit: the machine's memory (MB). STAR on a mouse genome needs ~30 GB, so a
## laptop with less cannot align (use a cluster profile or a smaller test genome).
resources:
  - mem_mb=64000

## Per-rule threads / memory / time (rules carry no resources of their own).
## These are starting values chosen from tool documentation and typical mouse-genome needs,
## NOT benchmarks of TTpipe: check each job's memory after a first run (seff / sacct) and adjust.
## STAR alignment used about 26 GB for the mouse genome in a test run; `star_index` needed about 29 GB in the mouse test run.
set-threads:
  fastqc: 4
  fastp: 8
  star_index: 16
  star_align: 16
  mapq_filter: 8
  mark_duplicates: 2
  split_strands: 8
  merge_bams: 8
  scale_factors: 1
  bigwig: 8
  bigwig_sample: 8
  gene_info: 1
  htseq_count: 1
  count_matrix: 1
  sample_table: 1
  deseq2: 2
  rnk: 1
  fgsea: 2
  sankey: 1
  results_explorer: 1
  stranded_signal: 2
  qc_summary: 1
  qc_report: 2
  multiqc: 1
set-resources:
  fastqc:
    mem_mb: 4000
  fastp:
    mem_mb: 8000
  star_index:
    mem_mb: 48000
  star_align:
    mem_mb: 40000
  mapq_filter:
    mem_mb: 4000
  mark_duplicates:
    mem_mb: 16000
  split_strands:
    mem_mb: 8000
  merge_bams:
    mem_mb: 8000
  scale_factors:
    mem_mb: 2000
  bigwig:
    mem_mb: 8000
  bigwig_sample:
    mem_mb: 8000
  gene_info:
    mem_mb: 2000
  htseq_count:
    mem_mb: 8000
  count_matrix:
    mem_mb: 4000
  sample_table:
    mem_mb: 1000
  deseq2:
    mem_mb: 8000
  rnk:
    mem_mb: 2000
  fgsea:
    mem_mb: 8000
  sankey:
    mem_mb: 4000
  results_explorer:
    mem_mb: 4000
  stranded_signal:
    mem_mb: 8000
  qc_summary:
    mem_mb: 2000
  qc_report:
    mem_mb: 8000
  multiqc:
    mem_mb: 4000
