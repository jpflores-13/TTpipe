## R environment for the analysis rules (deseq2, fgsea, sankey).
## Versions: one Bioconductor 3.20 release set (R 4.4). Each pin was checked to EXIST on the
## bioconda / conda-forge package index with an R 4.4 build (linux-64, osx-64, osx-arm64, linux-aarch64
## for the Bioconductor packages), and the Bioconductor builds depend on r-base >=4.4,<4.5.
## Solved on linux-64 (Pioneer) on 2026-11-17. The deseq2 and sankey rules ran in a real run;
## the fgsea rule did not run (no gene-set files were configured), so that code path is untested.
## The source guide (Magnitov et al. 2024 workflow) gives no R / DESeq2 versions, so these are a choice.
name: ttpipe_r
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4.3
  - bioconductor-deseq2=1.46.0
  - bioconductor-fgsea=1.32.2
  - bioconductor-biocparallel=1.40.0
  - r-ggplot2=3.5.1
  - r-ggforce=0.4.2
  - r-tidyr=1.3.1
