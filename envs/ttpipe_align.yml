name: ttpipe_align
## FastQC, fastp, STAR, samtools and Picard. Versions are the ones the guide used, except
## fastp (not in the guide; 0.23.4 is a recent release that has linux-64, osx-64 and osx-arm64 builds).
## Solved on linux-64 (Pioneer) on 2026-11-17 and used for a 4-sample real-data run; not tested on other platforms.
## STAR 2.7.9a and samtools 1.12 have no osx-arm64 build on bioconda (not tried under Rosetta here).
channels:
  - conda-forge
  - bioconda
dependencies:
  - fastqc=0.12.1
  - fastp=0.23.4
  - star=2.7.9a
  - samtools=1.12
  - picard=2.25.6
