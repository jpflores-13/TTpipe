# slitherFlow spec for the TTpipe subway map (https://github.com/mikemartinez99/slitherFlow).
# Hand-tuned from `slitherflow draft` on TTpipe's rule graph (every optional branch on, spike-in on).
# Render:  slitherflow render docs/img/ttpipe_subway.yaml -o docs/img/ttpipe_subway.svg --png

title: "TTpipe"
subtitle: "TT-seq processing and analysis  ·  Snakemake 8"

input: {label: "Input", sublabel: "Paired-end", file: "FASTQ"}

trunk:                                   # steps every sample goes through
  stations:
    - {name: "Trimming", tool: "fastp", optional: true}
    - {name: "Alignment", tool: "STAR"}
    - {name: "MAPQ filter", tool: "samtools"}
    - name: "Duplicates"
      tool: "Picard"
      outputs: [{file: "BAM", label: "Filtered alignments"}]
  lines: [tracks, expression, qc]        # top -> bottom on the trunk

lines:
  tracks:
    name: "Stranded tracks"
    color: "#0072B2"
    row: -1
    stations:
      - {name: "Split strands", tool: "samtools", x: 756}
      - {name: "Merge", tool: "samtools", x: 871}
      - {name: "Scale factors", tool: "Python", x: 986}
      - name: "Tracks"
        tool: "bamCoverage"
        x: 1106
        outputs: [{file: "bigWig", label: "Per strand", dy: -112}]
      - name: "Stranded page"
        tool: "Python"
        x: 1236
        outputs: [{file: "HTML", label: "Tracks, metagene", dy: -112}]

  expression:
    name: "Counts and differential expression"
    color: "#009E73"
    row: 0
    stations:
      - {name: "Counts", tool: "HTSeq", x: 756}
      - {name: "Matrix", tool: "Python", x: 871}
      - name: "DE analysis"
        tool: "DESeq2"
        x: 996
      - {name: "GSEA", tool: "fgsea", optional: true, x: 1111}
      - name: "Explorer"
        tool: "Python"
        x: 1236
        outputs: [{file: "HTML", label: "DEGs, GSEA"}]

  qc:
    name: "Quality control"
    color: "#CC79A7"
    row: 1
    to: terminus
    stations:
      - {name: "QC summary", tool: "Python", x: 936}

  readqc:
    name: "Quality control"
    color: "#CC79A7"
    from: input
    row: 2
    to: terminus
    stations:
      - {name: "Read QC", tool: "FastQC", x: 380}

  spike:
    name: "Spike-in normalization"
    color: "#D55E00"
    optional: true
    from: "Duplicates"
    row: -2
    to: {line: tracks, station: "Scale factors"}
    stations:
      - {name: "Spike-in counts", tool: "samtools idxstats", x: 816}

terminus: {name: "QC report", sublabel: "+ MultiQC", row: 1, file: "HTML"}

footnote: >-
  Dashed = optional (trim, gsea_collections, spike_in). The spike-in can also set the DESeq2 size factors.

style: {spacing: 130, branch_spacing: 110, row_height: 100}
